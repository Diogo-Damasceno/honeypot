[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "honeypot"
version = "0.1.0"
description = "Honeypot SSH/HTTP de baixa interação que registra e analisa tentativas de ataque."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Diogo Damasceno", email = "mitszukyo@gmail.com" }]
keywords = ["security", "honeypot", "ssh", "http", "threat-intel", "cybersecurity"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
honeypot = "honeypot.cli:main"

[tool.setuptools.packages.find]
include = ["honeypot*"]
